name: Rust
on:
  push:
    branches: [main]
    tags: ['fork-v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container: rust:1.99.0-bookworm@sha256:114c7a4425406451c2866b6aafe69fe29b1b298832db1277d411ac73c82d04d6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: rustup toolchain install nightly-2026-10-13 --profile minimal --component rustfmt
      - run: cargo +nightly-2026-10-13 fmt -- --check
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    container: rust:1.99.0-bookworm@sha256:114c7a4425406451c2866b6aafe69fe29b1b298832db1277d411ac73c82d04d6
    strategy:
      fail-fast: false
      matrix:
        features: ['', 'native_tls', 'rustls']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: sh scripts/check.sh '${{ matrix.features }}'
  hygiene:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    container: rust:1.99.0-bookworm@sha256:114c7a4425406451c2866b6aafe69fe29b1b298832db1277d411ac73c82d04d6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: apt-get update && apt-get install -y --no-install-recommends jq
      - uses: crate-ci/typos@f6708081b566d3e93f9b6ed2b66235ee47349889 # v1.39.2
      - run: rustup toolchain install nightly-2026-10-13 --profile minimal
      - name: Install checksum-pinned cargo-udeps
        run: |
          curl --fail --location --retry 2 --max-time 60 \
            https://github.com/est31/cargo-udeps/releases/download/v0.1.61/cargo-udeps-v0.1.61-x86_64-unknown-linux-gnu.tar.gz \
            -o /tmp/cargo-udeps.tar.gz
          echo '458419d47f48bc177e9b895b06abdccb08613f8a2d1b6eaf1729e968c041e03b  /tmp/cargo-udeps.tar.gz' | sha256sum --check --strict
          tar -xzf /tmp/cargo-udeps.tar.gz -C /tmp ./cargo-udeps-v0.1.61-x86_64-unknown-linux-gnu/cargo-udeps
          install -m 755 /tmp/cargo-udeps-v0.1.61-x86_64-unknown-linux-gnu/cargo-udeps /usr/local/cargo/bin/cargo-udeps
      - run: cargo +nightly-2026-10-13 udeps --locked --workspace --all-targets
  interop:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    container: rust:1.99.0-bookworm@sha256:114c7a4425406451c2866b6aafe69fe29b1b298832db1277d411ac73c82d04d6
    env:
      TZ: UTC
      RTU_TEST_PYTHON: /tmp/c104-peer/bin/python
      # Use the container toolchain without installing editor/lint components.
      RUSTUP_TOOLCHAIN: 1.99.0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: apt-get update && apt-get install -y --no-install-recommends python3 python3-venv
      - run: python3 -m venv /tmp/c104-peer
      - run: |
          /tmp/c104-peer/bin/pip install --only-binary=:all: --require-hashes -r tests/requirements-interop.txt
      - run: sh tests/run_rtu_e2e.sh
